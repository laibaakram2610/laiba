<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTI NAV BAR </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
    </style>

    </style>
    
    <style>
        :root {
            --primary-color:  palevioletred;
            --secondary-color: pink;
        }

        body{
            background-color: var(--secondary-color);
        }
        ul li {
            list-style: none;
            display: inline;
            padding: 10px 20px;
            font-weight: bold;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "EB Garamond", serif;
        }
        .nav {
            background-color: var(--primary-color);
            padding: 12px 0px;
        }
        .content{
            padding: 15px
            ;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <li>Services</li>
        </ul>
    </nav>
    <div class="content">
        <h2>Welcome to </h2>
        <p>this is a multicolor website using CSS variables </p>
    </div>
</body>

</html>
